# cms-managed-workflow: single-repository-v1
# Generated by CMS. Configure repository, branch and authorization in CMS.
name: Build CMS site
on:
  push:
    branches: ["main"]
    paths: ['cms-input/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cms-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fixed input
        uses: actions/checkout@v7
        with:
          path: input
          persist-credentials: false
      - name: Read fixed source and public address
        id: input
        env:
          DEFAULT_SITE_URL: "https://ezioswj.github.io/CMS_PRE/"
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.parse import urlsplit
          root = Path('input/cms-input')
          metadata = json.loads((root / 'export.json').read_text())
          assert metadata['schemaVersion'] == 1, 'Unsupported input schema'
          source = metadata['source']
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', source['repository']), 'Invalid source repository'
          assert re.fullmatch(r'[a-f0-9]{40}', source['sha']), 'Source must be an immutable SHA'
          site = json.loads((root / 'site.json').read_text()) if (root / 'site.json').exists() else {'url': os.environ['DEFAULT_SITE_URL']}
          parsed = urlsplit(site['url'])
          assert parsed.scheme == 'https' and parsed.hostname and not parsed.username and not parsed.password, 'Invalid Pages URL'
          assert not parsed.query and not parsed.fragment and '..' not in parsed.path.split('/') and '//' not in parsed.path, 'Invalid Pages path'
          origin = f'{parsed.scheme}://{parsed.netloc}'
          base = (parsed.path or '/').rstrip('/') + '/'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'repository': source['repository'], 'sha': source['sha'], 'origin': origin, 'base': base}.items():
                  assert '\n' not in value and '\r' not in value, 'Invalid output'
                  output.write(f'{key}={value}\n')
          PY
      - name: Check out fixed CMS source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.input.outputs.repository }}
          ref: ${{ steps.input.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Use the source Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/site/package-lock.json
      - name: Validate input and prepare public resources
        run: node source/scripts/prepare-git-site.mjs input/cms-input source/site
      - name: Install locked Astro dependencies
        working-directory: source/site
        run: npm ci
      - name: Build Astro once
        working-directory: source/site
        env:
          CMS_INPUT_PATH: ${{ github.workspace }}/input/cms-input/manifest.json
          CMS_PUBLIC_URL: ${{ steps.input.outputs.origin }}
          CMS_BASE_PATH: ${{ steps.input.outputs.base }}
          CMS_CANONICAL_URL: ''
        run: npm run build
      - name: Verify public output
        run: node source/scripts/prepare-git-site.mjs --check-output source/site/dist
      - name: Upload downloadable static site
        uses: actions/upload-artifact@v7
        with:
          name: cms-site-${{ github.sha }}
          path: source/site/dist/
          if-no-files-found: error
      - name: Upload the same output for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: source/site/dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
