# Installed in the public CMS input repository.
name: Build and deploy CMS site
on:
  push:
    branches: [main]
    paths: ['cms-input/**', '.github/workflows/build-site.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cms-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the event input commit
        uses: actions/checkout@v7
        with:
          path: input
          persist-credentials: false
      - name: Read fixed public source identity
        id: source
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          metadata = json.loads(Path('input/cms-input/export.json').read_text())
          assert metadata['schemaVersion'] == 1, 'Unsupported input schema'
          source = metadata['source']
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', source['repository']), 'Invalid source repository'
          assert re.fullmatch(r'[a-f0-9]{40}', source['sha']), 'Source must be an immutable SHA'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('repository=' + source['repository'] + '\n')
              output.write('sha=' + source['sha'] + '\n')
          PY
      - name: Check out the fixed Astro source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Configure GitHub Pages
        id: pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/configure-pages@v6
      - name: Resolve site base path
        id: base
        env:
          CONFIGURED_BASE: ${{ vars.CMS_BASE_PATH }}
          REPOSITORY: ${{ github.repository }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          owner, repository = os.environ['REPOSITORY'].split('/')
          fallback = '/' if repository.lower() == owner.lower() + '.github.io' else '/' + repository + '/'
          base = os.environ.get('CONFIGURED_BASE') or fallback
          assert base.startswith('/') and not base.startswith('//'), 'Base must be an absolute site path'
          assert not any(c in base for c in ('\\', '?', '#')), 'Invalid base path'
          assert not any(ord(c) < 32 or ord(c) == 127 for c in base), 'Invalid base control character'
          assert all(part not in ('.', '..') for part in base.split('/')), 'Invalid base segment'
          base = base.rstrip('/') + '/'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('path=' + base + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Build base: ' + base + '\n\n')
              summary.write('Pages URL: ' + os.environ.get('PAGES_URL', '') + '\n\n')
              summary.write('Pages configured base: ' + os.environ.get('PAGES_BASE', '') + '\n')
          print('CMS_BASE_PATH=' + base)
          PY
      - name: Use the source Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/site/package-lock.json
      - name: Validate portable input and prepare isolated public resources
        run: node source/scripts/prepare-git-site.mjs input/cms-input source/site
      - name: Install locked dependencies
        working-directory: source/site
        run: npm ci
      - name: Build once
        working-directory: source/site
        env:
          CMS_INPUT_PATH: ${{ github.workspace }}/input/cms-input/manifest.json
          CMS_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build
      - name: Verify static artifact boundary
        run: node source/scripts/prepare-git-site.mjs --check-output source/site/dist
      - name: Upload public static site
        uses: actions/upload-artifact@v7
        with:
          name: cms-site-${{ github.sha }}
          path: source/site/dist/
          if-no-files-found: error
          include-hidden-files: false
      - name: Upload GitHub Pages artifact
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: source/site/dist/
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: cms-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
